title = "Ticketing secret scan"
[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, build output and local Git metadata"
paths = ['''(^|/)(node_modules|target|dist|coverage|reports|\.git)/''']

[[allowlists]]
description = "Allow dev mock JWT secret"
regexes = [
    '''EventFlow-Secure-JWT-Token-Secret-Key-2026-Super-Secret-Key-256bit-Enterprise'''
]
