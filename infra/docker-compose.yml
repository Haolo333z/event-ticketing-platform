name: event-ticketing-local
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing_demo}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    command: ["postgres", "-c", "max_connections=50"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - postgres_demo:/var/lib/postgresql/data
volumes:
  postgres_demo:
