name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json
      - run: npm ci --prefix tools/contracts
      - run: npm test --prefix tools/contracts
      - run: npm audit --prefix tools/contracts --audit-level=high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: ticketing_ci
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ci-local-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PG_IT_URL: jdbc:postgresql://127.0.0.1:5432/ticketing_ci
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ci-local-fixture
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Isolated Kafka and database for recovery tests
        shell: bash
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U ticketing ticketing_kafka_ci
          KAFKA_PORT=19092 docker compose -f infra/docker-compose.yml -p ticketing-kafka-it-ci up -d --wait kafka
          echo 'KAFKA_IT_BOOTSTRAP=127.0.0.1:19092' >> "$GITHUB_ENV"
          echo 'KAFKA_IT_PG_URL=jdbc:postgresql://127.0.0.1:5432/ticketing_kafka_ci' >> "$GITHUB_ENV"
          echo 'KAFKA_IT_CONTAINER=ticketing-kafka-it-ci-kafka-1' >> "$GITHUB_ENV"
          echo 'KAFKA_IT_TOPIC=ticketing-kafka-it-ci.booking.v1' >> "$GITHUB_ENV"
      - name: Build, test and generate dependency SBOM
        working-directory: backend
        run: sh ./mvnw -B -ntp verify cyclonedx:makeAggregateBom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: |
            backend/target/surefire-reports/
            backend/target/part7-kafka-evidence.json
      - name: Remove only isolated Kafka resources
        if: always()
        run: KAFKA_PORT=19092 docker compose -f infra/docker-compose.yml -p ticketing-kafka-it-ci down --volumes
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix tools/contracts
      - name: Real backend and DOM UI integration
        shell: bash
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U ticketing ticketing_ui_ci
          java -jar backend/target/ticketing-backend-0.0.1-SNAPSHOT.jar --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ticketing_ui_ci --spring.profiles.active=test > /tmp/ticketing-ui.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/events | grep -q '20000000-0000-4000-8000-000000000002'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/ticketing-ui.log; exit 1; fi
          API_BASE_URL=http://127.0.0.1:8080 npm run test:live --prefix frontend
          API_BASE_URL=http://127.0.0.1:8080 npm run test:live --prefix tools/contracts
      - name: Seat UI and scheduled expiry with real PostgreSQL
        shell: bash
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U ticketing ticketing_expiry_ci
          java -jar backend/target/ticketing-backend-0.0.1-SNAPSHOT.jar --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ticketing_expiry_ci --spring.profiles.active=test --server.port=8081 --expiry.enabled=true --BOOKING_HOLD_TTL_SECONDS=4 --EXPIRY_INTERVAL_SECONDS=1 > /tmp/ticketing-expiry.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/api/events | grep -q '20000000-0000-4000-8000-000000000002'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/ticketing-expiry.log; exit 1; fi
          API_BASE_URL=http://127.0.0.1:8081 npm run test:live:seats --prefix frontend
      - name: Payment checkout and tickets with real PostgreSQL
        shell: bash
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U ticketing ticketing_payment_ci
          KAFKA_PORT=19092 docker compose -f infra/docker-compose.yml -p ticketing-kafka-it-ui up -d --wait kafka
          java -jar backend/target/ticketing-backend-0.0.1-SNAPSHOT.jar --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ticketing_payment_ci --spring.profiles.active=test --server.port=8082 --expiry.enabled=true --BOOKING_HOLD_TTL_SECONDS=4 --EXPIRY_INTERVAL_SECONDS=1 --messaging.enabled=true --messaging.bootstrap-servers=127.0.0.1:19092 --messaging.topic=ticketing.ui.booking.v1 --messaging.dlq-topic=ticketing.ui.booking.dlq.v1 --messaging.group-prefix=ticketing-ui-ci > /tmp/ticketing-payment.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"; KAFKA_PORT=19092 docker compose -f infra/docker-compose.yml -p ticketing-kafka-it-ui down --volumes' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/api/events | grep -q '20000000-0000-4000-8000-000000000002'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/ticketing-payment.log; exit 1; fi
          API_BASE_URL=http://127.0.0.1:8082 npm run test:live:payments --prefix frontend
      - name: Admin dashboard with real API and Kafka; production auth guard
        shell: bash
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U ticketing ticketing_admin_ci
          KAFKA_PORT=19092 docker compose -f infra/docker-compose.yml -p ticketing-kafka-it-admin up -d --wait kafka
          java -jar backend/target/ticketing-backend-0.0.1-SNAPSHOT.jar --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ticketing_admin_ci --spring.profiles.active=test --server.port=8083 --expiry.enabled=true --BOOKING_HOLD_TTL_SECONDS=60 --EXPIRY_INTERVAL_SECONDS=1 --messaging.enabled=true --messaging.bootstrap-servers=127.0.0.1:19092 --messaging.topic=ticketing.admin.booking.v1 --messaging.dlq-topic=ticketing.admin.booking.dlq.v1 --messaging.group-prefix=ticketing-admin-ci > /tmp/ticketing-admin.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"; KAFKA_PORT=19092 docker compose -f infra/docker-compose.yml -p ticketing-kafka-it-admin down --volumes' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8083/api/events | grep -q '20000000-0000-4000-8000-000000000002'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/ticketing-admin.log; exit 1; fi
          API_BASE_URL=http://127.0.0.1:8083 npm run test:live:admin --prefix frontend
          if timeout 30s java -jar backend/target/ticketing-backend-0.0.1-SNAPSHOT.jar --spring.main.web-application-type=none --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ticketing_admin_ci --spring.profiles.active=prod --demo.auth.enabled=true --messaging.enabled=false --expiry.enabled=false > /tmp/ticketing-prod-guard.log 2>&1; then
            echo 'FAIL: production accepted mock auth'
            exit 1
          fi
          grep -q 'Mock auth is allowed only in local/test profiles' /tmp/ticketing-prod-guard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-ui-test-evidence
          path: frontend/reports/part8-live.json
      - name: Install OSV Scanner
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 120 -o osv-scanner_linux_amd64 https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          curl --fail --location --retry 3 --max-time 120 -o osv-scanner_SHA256SUMS https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check --strict
          chmod +x osv-scanner_linux_amd64
      - name: Scan backend dependencies
        run: ./osv-scanner_linux_amd64 scan source --sbom backend/target/bom.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 120 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 3 --max-time 120 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner
      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner
