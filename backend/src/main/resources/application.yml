spring:
  application:
    name: ticketing-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${POSTGRES_DB:ticketing_demo}
    username: ${POSTGRES_USER:ticketing}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 2000
  flyway:
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
server:
  address: 127.0.0.1
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
expiry:
  enabled: ${EXPIRY_ENABLED:true}
messaging:
  enabled: ${MESSAGING_ENABLED:false}
  scheduling-enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  topic: ${KAFKA_TOPIC:ticketing.booking.v1}
  dlq-topic: ${KAFKA_DLQ_TOPIC:ticketing.booking.dlq.v1}
  group-prefix: ${KAFKA_GROUP_PREFIX:ticketing}
  refund-simulated-failures: ${REFUND_SIMULATED_FAILURES:0}
